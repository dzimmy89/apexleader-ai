# CI for pull requests and main (same steps as the former Depot CI).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.31.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          ADMIN_PASSWORD: ci-build-only
          JWT_SECRET: ci-build-only
          NEXT_PUBLIC_SITE_URL: https://defiuniversity.xyz
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDuGdDF6jYPcZbQTpbGZPwnl3Qynr-LMWc
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: defi-university-prod.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: defi-university-prod
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: defi-university-prod.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "309871336262"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:309871336262:web:d2dc4be5729ac1d5a6a347
        run: npm run build

      - name: Audit email pipeline
        run: npx tsx scripts/audit-email-pipeline.ts

      - name: Testimonial gate tests
        run: |
          command -v rg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)
          npx tsx scripts/test-testimonial-build-grep.ts
          npx tsx scripts/test-testimonials.ts

      - name: Courses, membership and coaching tests
        run: |
          npx tsx scripts/test-learn-courses.ts
          npx tsx scripts/test-stripe-webhook.ts
          npx tsx scripts/test-client-payments.ts
          npx tsx scripts/test-contact-page.ts
          npx tsx scripts/test-syllabus.ts
          npx tsx scripts/test-syllabus-pipeline.ts
          npx tsx scripts/test-coaching-delivery.ts
          npx tsx scripts/test-skool-access.ts

      # Dedicated step (not ./scripts/ci.sh): ci.sh would re-run npm ci/lint/build/audit
      # and extra local-only scripts that this workflow does not run.
      - name: Firestore rules tests
        working-directory: .
        env:
          CI: "true"
        run: |
          npx --yes firebase-tools@15.31.0 emulators:exec \
            --only firestore \
            --project demo-defi-university-rules \
            "npx tsx website/scripts/test-firestore-rules.ts"

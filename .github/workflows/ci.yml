# CI for pull requests and main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.31.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          ADMIN_PASSWORD: ci-build-only
          JWT_SECRET: ci-build-only
          NEXT_PUBLIC_SITE_URL: https://apexleader.ai
          # Placeholders until the ApexLeader.ai Firebase project exists;
          # the build only needs them to be present.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-only
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: apexleader-prod.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: apexleader-prod
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: apexleader-prod.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-build-only
        run: npm run build

      # The framework came from a crypto education site; keep its words out.
      - name: No leftover DeFi wording
        run: |
          if grep -rnIiE "defi ?u(niversity)?\b|\bdefi\b|skool|paperbell|hubspot|stablecoin|bitcoin|blockchain|self-custody|financial advice" \
              app components content lib middleware.ts \
              | grep -viE "hubspot(OptedOut|Bounced|Id|LifecycleStage|LeadStatus|_import)|CRM_(CONTACT_SOURCE|SALES_LIST)_HUBSPOT|HubSpot import|HubSpot-scale|pre-enrichment HubSpot|skoolMatch|skoolTier|non-HubSpot"; then
            echo "Found DeFi University wording (above). Replace it with ApexLeader.ai copy."
            exit 1
          fi

      - name: Courses and coaching tests
        run: |
          command -v rg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)
          npx tsx scripts/test-learn-courses.ts
          npx tsx scripts/test-stripe-webhook.ts
          npx tsx scripts/test-client-payments.ts
          npx tsx scripts/test-contact-page.ts
          npx tsx scripts/test-syllabus.ts
          npx tsx scripts/test-syllabus-pipeline.ts
          npx tsx scripts/test-coaching-delivery.ts
          npx tsx scripts/test-account-billing.ts
          npx tsx scripts/test-coaching-availability.ts
          npx tsx scripts/test-installment-schedule.ts
          npx tsx scripts/test-cron-dry-run.ts
          npx tsx scripts/test-discovery-links.ts
          npx tsx scripts/test-manual-only-contact.ts
          npx tsx scripts/test-list-people.ts
          npx tsx scripts/test-esign-engine.ts
          npx tsx scripts/test-admin-login.ts
          npx tsx scripts/test-operator-project-guard.ts
          npx tsx scripts/test-build-sha.ts

      # Firestore rules tests in the emulator.
      - name: Firestore rules tests
        working-directory: .
        env:
          CI: "true"
        run: |
          npx --yes firebase-tools@15.31.0 emulators:exec \
            --only firestore \
            --project demo-apexleader-rules \
            "npx tsx website/scripts/test-firestore-rules.ts"

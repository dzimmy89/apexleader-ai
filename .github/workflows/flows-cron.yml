name: Run the flows cron

# Calls /api/cron/process-flows on the live site: lesson follow-up emails and
# texts, the confirm reminder, coaching flow emails, the payment digest,
# calendar sync and call plans. Nothing else calls it (Cloud Scheduler is not
# enabled on apexleader-prod), so without this none of those go out.
#
# Runs every 15 minutes (owner approved 2026-11-11). Scheduled runs always
# use run mode. Marketing emails and texts each have their own switch
# (MARKETING_SENDS_ENABLED, SMS_SENDS_ENABLED in deploy-production.yml).
# By hand, dry-run asks the site what it would send and sends nothing.

on:
  schedule:
    # Off the quarter hours on purpose: GitHub delays or drops scheduled runs
    # that start at busy minutes (:00, :15, :30, :45). On 2026-11-11 the
    # "*/15" schedule fired once in twelve hours.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (report only) or run (sends)"
        type: choice
        options: [dry-run, run]
        default: dry-run

concurrency:
  group: flows-cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: apexleader-prod
      SITE_URL: https://fromaitobusiness.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          # Same keyless sign-in as deploy-production.yml.
          workload_identity_provider: projects/38118386790/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@apexleader-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Call the flows cron
        env:
          MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
        run: |
          set -euo pipefail
          SECRET="$(gcloud secrets versions access latest --secret=CRON_SECRET --project="${GCP_PROJECT_ID}")"
          echo "::add-mask::${SECRET}"
          URL="${SITE_URL}/api/cron/process-flows"
          if [ "${MODE}" != "run" ]; then URL="${URL}?dryRun=1"; fi
          echo "mode=${MODE}"
          STATUS="$(curl -sS -o response.json -w '%{http_code}' --max-time 280 -H "Authorization: Bearer ${SECRET}" "${URL}")"
          echo "http=${STATUS}"
          # Counts and step ids only: dry runs also list lead emails, which stay out of the log.
          jq 'if .error then {error} elif .dryRun then {marketingBlock, counts, due: ([.recipients[] | "\(.flow) \(.step) \(.action)"] | group_by(.) | map({(.[0]): length}) | add)} else {marketingBlocked, pending, sent, skipped, failed, deferred, exited, textsSent, confirmReminders, calendarSync, callPlans, paymentDigest} end' response.json 2>/dev/null | sed -E 's/[^[:space:]"]+@[^[:space:]"]+/[email]/g' || head -c 300 response.json
          test "${STATUS}" = "200"

      # If the site answered with an error, show the matching lines from the
      # Cloud Run log (message text only, with any email address blanked).
      - name: Recent site errors
        if: failure()
        continue-on-error: true
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="apexleader-ai" AND severity>=ERROR AND textPayload:"process-flows"' \
            --project="${GCP_PROJECT_ID}" --freshness=30m --limit=5 --format='value(textPayload)' | cut -c1-600 | sed -E 's/[^[:space:]"]+@[^[:space:]"]+/[email]/g'

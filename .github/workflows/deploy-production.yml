# Production deploy: Cloud Build builds the image, the workflow deploys it to
# Cloud Run, then publishes the Firestore rules (fail closed), checks the live
# rules and checks /api/version.
#
# Runs on every push to main. GitHub signs in to Google Cloud with Workload
# Identity Federation (no key files), so the settings below are all it needs.
# None of them are secret: the Firebase web config ships to every browser.
#
# SITE_URL is the live domain, mapped to the Cloud Run service and listed in
# Firebase Auth's authorized domains. See website/DEPLOY.md.

name: Deploy Website to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: apexleader-prod
  GCP_REGION: us-central1
  SERVICE: apexleader-ai
  SITE_URL: https://fromaitobusiness.com
  WIF_PROVIDER: projects/38118386790/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deploy@apexleader-prod.iam.gserviceaccount.com
  # Coach mailbox: sender, reply-to and the calendar 1:1 bookings land on.
  ADMIN_EMAIL: hello@fromaitobusiness.com
  # Google accounts allowed into /admin (comma-separated).
  ADMIN_GOOGLE_LOGINS: hello@fromaitobusiness.com,hello@defiuniversity.xyz
  # Firebase web app "FromAItoBusiness web" (public browser config).
  FIREBASE_API_KEY: AIzaSyCG3btj18GwWVHwky3PD410asZDVMoD4fQ
  FIREBASE_MESSAGING_SENDER_ID: "38118386790"
  FIREBASE_APP_ID: 1:38118386790:web:e00fc2fc3f65ab71e551a7

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          ADMIN_PASSWORD: ci-build-only
          JWT_SECRET: ci-build-only
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.GCP_PROJECT }}.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.GCP_PROJECT }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ env.GCP_PROJECT }}.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ env.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID }}
        run: npm run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      # Pin the triggering SHA and clean the tree so the job can never deploy
      # database/security-rules.rules (or the app) from an older commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Verify deploy checkout SHA and rules digest
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-.}"

          EXPECTED_SHA="${GITHUB_SHA:-}"
          echo "github.sha=${{ github.sha }}"
          echo "github.event.after=${{ github.event.after }}"
          echo "github.ref=${{ github.ref }}"
          echo "GITHUB_SHA=${EXPECTED_SHA}"
          echo "head_before=$(git rev-parse HEAD)"
          echo "pwd=$(pwd)"

          if [ -z "$EXPECTED_SHA" ]; then
            echo "error: GITHUB_SHA is empty; refusing to continue from an unknown ref" >&2
            exit 1
          fi

          git fetch --force --depth=1 origin "$EXPECTED_SHA"
          git checkout --force "$EXPECTED_SHA"
          HEAD_AFTER="$(git rev-parse HEAD)"
          echo "head_after=${HEAD_AFTER}"
          if [ "$HEAD_AFTER" != "$EXPECTED_SHA" ]; then
            echo "error: HEAD ${HEAD_AFTER} != triggering SHA ${EXPECTED_SHA} (stale checkout)" >&2
            exit 1
          fi

          RULES_FILE="$(python3 -c 'import json; print(json.load(open("firebase.json"))["firestore"]["rules"])')"
          echo "rules_file=${RULES_FILE}"
          sha256sum "$RULES_FILE"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          project_id: ${{ env.GCP_PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write BUILD_SHA into the Cloud Build context
        run: |
          set -euo pipefail
          git rev-parse HEAD > website/BUILD_SHA
          cat website/BUILD_SHA

      - name: Build the image with Cloud Build
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/cloud-run-source-deploy/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit website \
            --config=website/cloudbuild.yaml \
            --project="${GCP_PROJECT}" \
            --substitutions="_IMAGE=${IMAGE},_SITE_URL=${SITE_URL},_FIREBASE_API_KEY=${FIREBASE_API_KEY},_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID},_FIREBASE_APP_ID=${FIREBASE_APP_ID}"

      # Only secrets that exist in Secret Manager are mounted, so Stripe, mail
      # and calendar can be added later without editing this file.
      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          WANTED="GOOGLE_SERVICE_ACCOUNT_KEY CRON_SECRET INTERNAL_WEBHOOK_SECRET ADMIN_USERNAME ADMIN_PASSWORD ADMIN_TEAM_PASSWORD_HASH JWT_SECRET MAILING_ADDRESS STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_FOUNDATIONS_FULL STRIPE_PRICE_FOUNDATIONS_3PAY STRIPE_PRICE_FOUNDATIONS_6PAY STRIPE_PRICE_MASTERY_FULL STRIPE_PRICE_MASTERY_3PAY STRIPE_PRICE_MASTERY_6PAY STRIPE_PRICE_INSTITUTIONAL_FULL STRIPE_PRICE_INSTITUTIONAL_3PAY STRIPE_PRICE_INSTITUTIONAL_6PAY COACH_CALENDAR_ID COACH_TIMEZONE COACH_NAME CONTRACTS_GCS_BUCKET CONTRACT_SIGN_TOKEN_TTL_DAYS"
          EXISTING=" $(gcloud secrets list --project="${GCP_PROJECT}" --format='value(name.basename())' | tr '\n' ' ') "
          SECRETS=""
          for name in $WANTED; do
            case "$EXISTING" in
              *" ${name} "*) SECRETS="${SECRETS:+${SECRETS},}${name}=${name}:latest" ;;
              *) echo "not set yet: ${name}" ;;
            esac
          done
          echo "mounting: ${SECRETS}"

          ENV_VARS="NODE_ENV=production|GCP_PROJECT_ID=${GCP_PROJECT}|NEXT_PUBLIC_SITE_URL=${SITE_URL}|CRM_STORAGE=firestore|ADMIN_GOOGLE_ALLOWLIST=${ADMIN_GOOGLE_LOGINS}|SENDER_EMAIL=${ADMIN_EMAIL}|SENDER_DOMAINS=${ADMIN_EMAIL#*@}|SENDER_NAME=FromAItoBusiness|NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}|NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${GCP_PROJECT}.firebaseapp.com|NEXT_PUBLIC_FIREBASE_PROJECT_ID=${GCP_PROJECT}|NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${GCP_PROJECT}.firebasestorage.app|NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}|NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID}|MARKETING_SENDS_ENABLED=false"

          # min-instances 0 keeps an idle site inside Cloud Run's free tier
          # (the first visit after a quiet spell takes a few seconds).
          gcloud run deploy "${SERVICE}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=600 \
            --set-env-vars="^|^${ENV_VARS}" \
            ${SECRETS:+--set-secrets="${SECRETS}"}

      # Pin matches .github/workflows/ci.yml (firebase-tools@15.31.0).
      # --only firestore:rules deploys rules without indexes. Fail closed (no continue-on-error).
      - name: Deploy Firestore security rules
        if: env.FIREBASE_APP_ID != ''
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-.}"
          EXPECTED_PROJECT="${GCP_PROJECT}"

          echo "head_rules_step=$(git rev-parse HEAD)"
          echo "GITHUB_SHA=${GITHUB_SHA:-}"
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA:-}" ]; then
            echo "error: HEAD no longer matches GITHUB_SHA" >&2
            exit 1
          fi
          RULES_FILE="$(python3 -c 'import json; print(json.load(open("firebase.json"))["firestore"]["rules"])')"
          sha256sum "$RULES_FILE"

          GCLOUD_PROJECT="$(gcloud config get-value project 2>/dev/null || true)"
          echo "gcloud_project=${GCLOUD_PROJECT}"
          echo "firebase_deploy_project=${EXPECTED_PROJECT}"
          if [ "${GCLOUD_PROJECT}" != "${EXPECTED_PROJECT}" ]; then
            echo "error: gcloud project is '${GCLOUD_PROJECT}', expected ${EXPECTED_PROJECT}" >&2
            exit 1
          fi

          npm install -g firebase-tools@15.31.0
          firebase deploy --only firestore:rules --project "${EXPECTED_PROJECT}" --non-interactive
        # Needs github-deploy: roles/firebase.admin + roles/firebaserules.admin

      - name: Verify live Firestore rules match repo
        if: env.FIREBASE_APP_ID != ''
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-.}"
          EXPECTED_PROJECT="${GCP_PROJECT}"

          GCLOUD_PROJECT="$(gcloud config get-value project 2>/dev/null || true)"
          echo "gcloud_project=${GCLOUD_PROJECT}"
          if [ "${GCLOUD_PROJECT}" != "${EXPECTED_PROJECT}" ]; then
            echo "error: gcloud project is '${GCLOUD_PROJECT}', expected ${EXPECTED_PROJECT}" >&2
            exit 1
          fi

          GOOGLE_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          export GOOGLE_ACCESS_TOKEN
          export EXPECTED_PROJECT
          RULES_REL="$(python3 -c 'import json; print(json.load(open("firebase.json"))["firestore"]["rules"])')"
          export LOCAL_RULES_PATH="$(pwd)/${RULES_REL}"
          echo "verify_rules_path=${LOCAL_RULES_PATH}"
          echo "verify_HEAD=$(git rev-parse HEAD)"
          sha256sum "$LOCAL_RULES_PATH"
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          expected_project = os.environ["EXPECTED_PROJECT"]
          token = os.environ["GOOGLE_ACCESS_TOKEN"]
          local_path = os.environ["LOCAL_RULES_PATH"]
          release_url = (
              f"https://firebaserules.googleapis.com/v1/projects/{expected_project}/releases/cloud.firestore"
          )


          def fetch(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"error: Rules API GET {url} failed: HTTP {exc.code}", file=sys.stderr)
                  raise SystemExit(1) from exc


          def normalize(text: str) -> str:
              return text.replace("\r\n", "\n").rstrip() + "\n"


          release = fetch(release_url)
          release_name = release.get("name") or ""
          ruleset_name = release.get("rulesetName") or ""
          print(f"releaseName={release_name}")
          print(f"rulesetName={ruleset_name}")
          print(f"updateTime={release.get('updateTime', '')}")
          expected_prefix = f"projects/{expected_project}/"
          if not release_name.startswith(expected_prefix):
              print(
                  f"error: Rules API release name is '{release_name}', "
                  f"expected prefix {expected_prefix}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          if not ruleset_name:
              print("error: release has no rulesetName", file=sys.stderr)
              raise SystemExit(1)
          if not ruleset_name.startswith(expected_prefix):
              print(
                  f"error: Rules API rulesetName is '{ruleset_name}', "
                  f"expected prefix {expected_prefix}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          ruleset = fetch(f"https://firebaserules.googleapis.com/v1/{ruleset_name}")
          files = (ruleset.get("source") or {}).get("files") or []
          if not files:
              print("error: live ruleset has no source files", file=sys.stderr)
              raise SystemExit(1)

          live = None
          for source_file in files:
              name = source_file.get("name") or ""
              if name == "database/security-rules.rules" or name.endswith(
                  "security-rules.rules"
              ):
                  live = source_file.get("content") or ""
                  break
          if live is None:
              live = files[0].get("content") or ""

          with open(local_path, encoding="utf-8") as handle:
              expected = handle.read()

          if "uidMemberExists" in live:
              print("error: live rules still contain uidMemberExists", file=sys.stderr)
              raise SystemExit(1)
          if "emailVerified()" not in live:
              print("error: live rules lack emailVerified()", file=sys.stderr)
              raise SystemExit(1)
          if normalize(live) != normalize(expected):
              print(
                  "error: live Firestore (default) rules do not match repo "
                  f"(live_len={len(live)} repo_len={len(expected)})",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print("ok: live Firestore (default) rules match repo")
          PY
          unset GOOGLE_ACCESS_TOKEN

      - name: Verify the live site serves this commit
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 12); do
            LIVE_SHA="$(curl -sf "${SITE_URL}/api/version" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' || true)"
            echo "attempt ${attempt}: live=${LIVE_SHA} expected=${EXPECTED_SHA}"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "ok: ${SITE_URL} is serving ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "error: ${SITE_URL}/api/version did not report ${EXPECTED_SHA}" >&2
          exit 1

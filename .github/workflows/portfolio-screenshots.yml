name: Portfolio screenshots

# Screenshots each public portfolio homepage and commits them to the branch
# that ran it. Runs by hand, or on a branch push that changes the capture
# script, since the sites can't be reached from every dev environment.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - website/scripts/capture-portfolio-screenshots.ts
      - .github/workflows/portfolio-screenshots.yml

permissions:
  contents: write

concurrency:
  group: portfolio-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Capture homepages
        run: npx tsx scripts/capture-portfolio-screenshots.ts
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portfolio
          if git diff --cached --quiet; then
            echo "No screenshot changes."
            exit 0
          fi
          git commit -m "Update portfolio homepage screenshots"
          git push

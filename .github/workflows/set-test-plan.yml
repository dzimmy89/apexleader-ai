name: Set a test coaching plan

on:
  workflow_dispatch:
    inputs:
      email:
        description: "hello@fromaitobusiness.com or a +test address"
        required: true
        default: hello@fromaitobusiness.com
      package:
        description: "Package"
        type: choice
        options:
          - mastery
          - foundations
          - institutional
          - build_launch
        default: mastery
      mode:
        description: "dry-run changes nothing; apply writes the client record"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: set-test-plan
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: website
    env:
      GCP_PROJECT_ID: apexleader-prod
      CRM_STORAGE: firestore
      TEST_EMAIL: ${{ inputs.email }}
      TEST_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          # Same keyless sign-in as deploy-production.yml.
          workload_identity_provider: projects/38118386790/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@apexleader-prod.iam.gserviceaccount.com

      - name: Set plan (dry run)
        if: inputs.mode == 'dry-run'
        run: npx tsx scripts/set-test-plan.ts

      - name: Set plan
        if: inputs.mode == 'apply'
        env:
          NODE_ENV: production
        run: npx tsx scripts/set-test-plan.ts --apply

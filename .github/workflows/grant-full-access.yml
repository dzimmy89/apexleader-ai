# Gives one email permanent course access and the private coaching area on
# /account (scripts/grant-full-access.ts). Run by hand from the Actions tab.

name: Grant full access

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email to grant (they sign in with a magic link to this address)"
        required: true
        default: hello@apexleader.ai
      mode:
        description: "dry-run changes nothing; apply writes Firestore"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: grant-full-access
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: website
    env:
      GCP_PROJECT_ID: apexleader-prod
      GRANT_EMAIL: ${{ inputs.email }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          # Same keyless sign-in as deploy-production.yml. github-deploy needs
          # Secret Manager and Firestore write roles for this workflow.
          workload_identity_provider: projects/38118386790/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@apexleader-prod.iam.gserviceaccount.com

      - name: Grant (dry run)
        if: inputs.mode == 'dry-run'
        run: npx tsx scripts/grant-full-access.ts

      - name: Grant
        if: inputs.mode == 'apply'
        run: npx tsx scripts/grant-full-access.ts --apply

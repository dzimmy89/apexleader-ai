# Firebase web config comes in as substitutions from the deploy workflow
# (repository variables FIREBASE_API_KEY, FIREBASE_MESSAGING_SENDER_ID,
# FIREBASE_APP_ID). Marketing sends stay off until the business has a
# postal address in content/site.ts.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/apexleader-ai:latest
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=apexleader-prod.firebaseapp.com
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=apexleader-prod
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=apexleader-prod.firebasestorage.app
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/apexleader-ai:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - apexleader-ai
      - --image
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/apexleader-ai:latest
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory=1Gi
      - --cpu=1
      - --min-instances=1
      - --max-instances=10
      - --concurrency=80
      - --timeout=600
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=apexleader-prod,NEXT_PUBLIC_SITE_URL=https://apexleader.ai,CRM_STORAGE=firestore,ADMIN_GOOGLE_ALLOWLIST=hello@apexleader.ai,SENDER_EMAIL=hello@apexleader.ai,SENDER_NAME=ApexLeader.ai,NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=apexleader-prod.firebaseapp.com,NEXT_PUBLIC_FIREBASE_PROJECT_ID=apexleader-prod,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=apexleader-prod.firebasestorage.app,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID},MARKETING_SENDS_ENABLED=false
      - --set-secrets=GOOGLE_SERVICE_ACCOUNT_KEY=GOOGLE_SERVICE_ACCOUNT_KEY:latest,CRON_SECRET=CRON_SECRET:latest,INTERNAL_WEBHOOK_SECRET=INTERNAL_WEBHOOK_SECRET:latest,ADMIN_USERNAME=ADMIN_USERNAME:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,MAILING_ADDRESS=MAILING_ADDRESS:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,STRIPE_PRICE_FOUNDATIONS_FULL=STRIPE_PRICE_FOUNDATIONS_FULL:latest,STRIPE_PRICE_FOUNDATIONS_3PAY=STRIPE_PRICE_FOUNDATIONS_3PAY:latest,STRIPE_PRICE_FOUNDATIONS_6PAY=STRIPE_PRICE_FOUNDATIONS_6PAY:latest,STRIPE_PRICE_MASTERY_FULL=STRIPE_PRICE_MASTERY_FULL:latest,STRIPE_PRICE_MASTERY_3PAY=STRIPE_PRICE_MASTERY_3PAY:latest,STRIPE_PRICE_MASTERY_6PAY=STRIPE_PRICE_MASTERY_6PAY:latest,STRIPE_PRICE_INSTITUTIONAL_FULL=STRIPE_PRICE_INSTITUTIONAL_FULL:latest,STRIPE_PRICE_INSTITUTIONAL_3PAY=STRIPE_PRICE_INSTITUTIONAL_3PAY:latest,STRIPE_PRICE_INSTITUTIONAL_6PAY=STRIPE_PRICE_INSTITUTIONAL_6PAY:latest,COACH_CALENDAR_ID=COACH_CALENDAR_ID:latest,COACH_TIMEZONE=COACH_TIMEZONE:latest,COACH_NAME=COACH_NAME:latest,CONTRACTS_GCS_BUCKET=CONTRACTS_GCS_BUCKET:latest,CONTRACT_SIGN_TOKEN_TTL_DAYS=CONTRACT_SIGN_TOKEN_TTL_DAYS:latest,ADMIN_TEAM_PASSWORD_HASH=ADMIN_TEAM_PASSWORD_HASH:latest

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/apexleader-ai:latest

substitutions:
  _FIREBASE_API_KEY: ""
  _FIREBASE_MESSAGING_SENDER_ID: ""
  _FIREBASE_APP_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY

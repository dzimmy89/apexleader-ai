<!doctype html><meta charset="utf-8">
<meta name="out" content="public/learn/figures/ai-accounting/lesson-04-fig-1.webp">
<link rel="stylesheet" href="../../../../scripts/learn/infographics/brand.css">
<style>
.wrap{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.wk{display:flex;flex-direction:column;gap:8px;padding:14px 18px;border:1.5px solid var(--line);border-radius:16px;background:var(--panel)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.tot{border-top:1.5px solid var(--line-strong);padding-top:8px}
.op{font:700 28px/1 var(--display);color:var(--muted);width:24px}
.hl{background:color-mix(in oklch,var(--track) 22%,transparent);border-radius:8px;padding:4px 8px;margin:0 -8px}
.link{display:flex;flex-direction:column;align-items:center;gap:6px}
.link .arrow{font-size:44px;color:var(--track)}
.foot{display:flex;justify-content:space-between;align-items:center}
</style>
<div class="fig wide accounting">
  <div class="wrap">
    <div class="wk"><span class="sys">Week 1</span>
      <div class="row"><span class="small">Opening cash</span></div>
      <div class="row"><span class="small">Cash in</span><span class="op">+</span></div>
      <div class="row"><span class="small">Cash out</span><span class="op">&minus;</span></div>
      <div class="row tot hl"><span class="label">Closing cash</span></div>
    </div>
    <div class="link"><span class="arrow">&rarr;</span><span class="sys">the link</span></div>
    <div class="wk"><span class="sys">Week 2</span>
      <div class="row hl"><span class="label">Opening cash</span></div>
      <div class="row"><span class="small">Cash in</span><span class="op">+</span></div>
      <div class="row"><span class="small">Cash out</span><span class="op">&minus;</span></div>
      <div class="row tot"><span class="small">Closing cash</span></div>
    </div>
  </div>
  <div class="foot"><span class="label">Repeat for 13 weeks</span><span class="small">Below the buffer turns red</span></div>
</div>

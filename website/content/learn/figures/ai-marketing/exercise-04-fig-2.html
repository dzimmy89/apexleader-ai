<!doctype html><meta charset="utf-8">
<meta name="out" content="public/learn/figures/ai-marketing/exercise-04-fig-2.webp">
<link rel="stylesheet" href="../../../../scripts/learn/infographics/brand.css">
<style>
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wrap{flex:1;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.big{display:flex;flex-direction:column;gap:4px}
.big .num{font-size:80px}
.bar{display:flex;height:56px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
.seg{display:flex;align-items:center;justify-content:center;font:600 26px/1 var(--body);white-space:nowrap}
.hi{flex:5;background:color-mix(in oklch,var(--track) 45%,transparent)}
.nm{flex:1.6;background:var(--panel-raised);color:var(--muted)}
.right{display:flex;flex-direction:column;gap:12px}
.flag{display:flex;align-items:center;gap:12px}
.flag .label{color:var(--paper-text)}
</style>
<div class="fig wide marketing">
  <div class="head"><span class="label">Rolling Ledger sweep</span><span class="sys">example</span></div>
  <div class="wrap">
    <div class="big"><span class="num">6</span><span class="small">mismatches</span></div>
    <div class="right">
      <div class="bar"><div class="seg hi">5 HIGH: annual plan</div><div class="seg nm">1 normal</div></div>
      <span class="small">5 approved, 1 rewritten. 2 drafts, 1 pull request.</span>
    </div>
  </div>
  <div class="paper flag"><svg class="icon signal" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg><span class="label">Stripe annual price: the founder made it</span></div>
</div>

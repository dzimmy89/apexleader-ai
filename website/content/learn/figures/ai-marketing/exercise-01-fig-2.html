<link rel="stylesheet" href="../../../../scripts/learn/infographics/brand.css">
<style>
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{display:flex;align-items:baseline;gap:14px}

.ok{flex:15;background:color-mix(in oklch,var(--track) 30%,transparent)}
.dr{flex:6;background:var(--panel-raised);color:var(--muted)}

.notes{display:flex;gap:12px}
.notes .card{flex:1;align-items:center}

<div class="fig wide marketing">

    <div class="card"><svg class="icon muted" viewBox="0 0 24 24" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg><span class="small">Review took 40 min</span></div>
  </div>
</div>
